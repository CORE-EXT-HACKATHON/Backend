version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: insurely_db
      POSTGRES_USER: insurely_user
      POSTGRES_PASSWORD: insurely_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurely_user -d insurely_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://insurely_user:insurely_pass@db:5432/insurely_db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createcachetable &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2
             --timeout 120
             --log-level info
             --access-logfile -
             --error-logfile -"

volumes:
  postgres_data: